services:
  - type: web
    name: sravantix-app
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_MIGRATION_API
        value: "true"
      - key: VITE_MIGRATION_API_URL
        value: https://sravantix.onrender.com
      - key: VITE_MIGRATION_OWNER_ID
        value: j578rer2tz9p04rxwyny94fdrs8e3kfw
      - key: VITE_MIGRATION_ALLOW_OWNER_FALLBACK
        value: "false"
      - key: VITE_AUTH_PROVIDER
        value: supabase
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    domains:
      - www.sravantix.com