services:
  - type: web
    name: sravantix-app
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_MIGRATION_API
        value: "true"
      - key: VITE_MIGRATION_API_URL
        value: https://sravantix.onrender.com
      - key: VITE_MIGRATION_OWNER_ID
        value: j578rer2tz9p04rxwyny94fdrs8e3kfw
      - key: VITE_MIGRATION_ALLOW_OWNER_FALLBACK
        value: "false"
      - key: VITE_AUTH_PROVIDER
        value: supabase
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: falseservices:
  - type: web
    name: sravantix-frontend
    runtime: static
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_CONVEX_URL
        sync: false
      - key: VITE_HERCULES_OIDC_AUTHORITY
        sync: false
      - key: VITE_HERCULES_OIDC_CLIENT_ID
        sync: false
      - key: VITE_HERCULES_OIDC_PROMPT
        value: select_account
      - key: VITE_HERCULES_OIDC_RESPONSE_TYPE
        value: code
      - key: VITE_HERCULES_OIDC_SCOPE
        value: openid profile email offline_access
      - key: VITE_HERCULES_OIDC_REDIRECT_URI
        sync: false
      - key: VITE_MIGRATION_API
        value: "false"
      - key: VITE_MIGRATION_API_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false